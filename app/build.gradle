plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.youarelaunched.challenge'
    compileSdk gradleDependencies.compileSdk

    defaultConfig {
        applicationId "com.youarelaunched.challenge"
        minSdk gradleDependencies.minSdk
        targetSdk gradleDependencies.targetSdk
        versionCode 1
        versionName "1.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            applicationIdSuffix ".app"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            applicationIdSuffix ".development"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    implementation compose.activity
    implementation compose.ui
    implementation compose.material
    implementation compose.runtime
    implementation compose.foundation
    implementation compose.foundationLayout
    implementation compose.uiToolingPreview
    implementation compose.googleFonts
    implementation retrofit.jsonConverter

    implementation coil.compose
    implementation coil.svg

    implementation lifecycle.viewModelCompose
    implementation lifecycle.runtimeCompose

    // Hilt dependency injection (KSP processor)
    implementation hiltDeps.android
    ksp hiltDeps.compiler

    testImplementation testLibs.junit
    testImplementation testLibs.coroutinesTest
}